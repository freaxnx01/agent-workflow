# The §9.6 restore step may map the job token — and nothing else. A second
# secret in that same step's env must still be reported.
trigger: none
pr: none

pool: <pool>

steps:
  - checkout: self
    persistCredentials: false

  - bash: '/usr/bin/bash "$(Agent.TempDirectory)/aw/scripts/azdo-pr-feed-restore.sh"'
    displayName: restore private feeds (target branch)
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      CLAUDE_CODE_OAUTH_TOKEN: abc

  # --- BUILD/TEST: edit this step only ---
  - script: |
      dotnet build
      dotnet test --no-build
    displayName: Build and test
