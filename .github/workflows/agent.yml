# Production caller — dogfoods this pipeline on its OWN issues.
#
# Trigger: apply the `ai-implement` label to an issue. The agent implements it
# and opens a draft PR. Because `ai-review-human-merge: true` is set here, an issue that
# ALSO carries `ai-review-human-merge` runs that flow (ADR-004, named by ADR-009): the agent
# reviews its own draft PR and, on approve, promotes it to ready for a HUMAN to
# merge — no envelope, no auto-merge. Issues without `ai-review-human-merge` get the
# plain draft-only flow (#1).
#
# Self-dogfood specifics:
#   - `uses: ./...` calls the reusable workflow from the SAME (default-branch)
#     commit, so a run exercises current `main`.
#   - `local-scripts: true` uses this repo's own scripts/ instead of a cross-repo
#     checkout (the consumer repo IS the pipeline repo here), sidestepping the
#     pipeline-repo/ref gotcha in CONSUMER-SETUP.md.
name: Agent

on:
  issues:
    types: [labeled]

# A reusable workflow can't be granted more than its caller, and this repo's
# default GITHUB_TOKEN is read-only — without this block the run fails at
# startup (see CONSUMER-SETUP.md gotcha #5).
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude:
    if: github.event.label.name == 'ai-implement'
    uses: ./.github/workflows/agent-implement.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      issue-number: ${{ github.event.issue.number }}
      runner-labels: '["ubuntu-latest"]'
      default-model: claude-sonnet-5
      local-scripts: true
      ai-review-human-merge: true
      # The action's own default is 10 minutes, which kills a multi-task plan
      # mid-implementation while max_turns is nowhere near spent (#280 died
      # there twice). At the ~7.7s/turn this repo actually measures, the
      # 160-turn tier classify-turns.sh can hand out needs ~20 minutes, so a
      # cap below that makes the top tiers unreachable. 25 was measured too
      # small in turn: #280's 8-task plan reached only task 3 of 8 before the
      # 25-minute cap killed it. Stays under timeout-minutes below, so the
      # process cap trips first and the job still reports a result.
      claude-timeout-minutes: 55
      # The reusable workflow defaults the job cap to 30, which would trip
      # before the process cap above and kill the job without a run report.
      timeout-minutes: 60
      self-fix: true
      self-fix-max-iterations: 2
