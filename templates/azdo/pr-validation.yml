# Copy into your repo as `azure-pipelines-pr.yml`.
#
# Triggered by a build-validation branch policy on the target branch, not by
# YAML: both CI and PR triggers are disabled below.
#
# This pipeline runs agent-written code. Never link a variable group, never map
# the job access token into a step, and never pass secrets in `env:`.
# See docs/AZDO-PIPELINE-SETUP.md section 9.
# With private feeds see docs/AZDO-PIPELINE-SETUP.md section 9.6.
trigger: none
pr: none

pool: <pool>

steps:
  - checkout: self
    persistCredentials: false
    # The merge commit's first parent is the target branch's tip, which is the
    # only commit the private-feed restore below ever evaluates (section 9.6).
    fetchDepth: 2

  # --- PRIVATE FEEDS (section 9.6): leave these two steps as they are ---
  # Both are skipped while AWF_NUGET_FEEDS is empty or unset, and neither runs
  # a single line from the PR: this one clones agent-workflow at the pinned
  # AGENT_WORKFLOW_REF, hermetically, because it is what brings in the script
  # the next step runs.
  - bash: |
      set -euo pipefail
      /usr/bin/mkdir -p "$AWF_HOME"
      /usr/bin/env -i PATH="$AWF_PATH" HOME="$AWF_HOME" GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
        /usr/bin/git -c core.hooksPath=/dev/null -c core.fsmonitor=false clone -q --filter=blob:none "$AWF_REPO" "$AWF_DIR"
      /usr/bin/env -i PATH="$AWF_PATH" HOME="$AWF_HOME" GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
        /usr/bin/git -c core.hooksPath=/dev/null -c core.fsmonitor=false -C "$AWF_DIR" checkout -q "$AWF_REF"
    displayName: fetch agent-workflow (pinned, hermetic)
    condition: and(succeeded(), ne(variables['AWF_NUGET_FEEDS'], ''))
    env:
      AWF_PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      AWF_HOME: $(Agent.TempDirectory)/awf-home
      AWF_REPO: https://github.com/freaxnx01/agent-workflow
      AWF_DIR: $(Agent.TempDirectory)/aw
      AWF_REF: $(AGENT_WORKFLOW_REF)

  # The only step of this pipeline that may hold the job token. It restores the
  # target branch's packages into the fallback folder and, on success, hands
  # the build step below NUGET_FALLBACK_PACKAGES. The interpreter is named by
  # absolute path: the script's shebang would look `bash` up on the inherited
  # PATH, whose first entry the job user can write.
  - bash: '/usr/bin/bash "$(Agent.TempDirectory)/aw/scripts/azdo-pr-feed-restore.sh"'
    displayName: restore private feeds (target branch)
    condition: and(succeeded(), ne(variables['AWF_NUGET_FEEDS'], ''))
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      AWF_PR_RESTORE_WORK_DIR: $(Agent.TempDirectory)
      # Test-only hooks of the script: blank, so a pipeline variable of the same
      # name cannot reach it.
      AWF_TEST_HERMETIC_PATH: ''
      AWF_TEST_CACHE_ROOT: ''

  # --- BUILD/TEST: edit this step only ---
  # Default is .NET. Non-.NET repos replace the script (`true` is the minimal placeholder).
  - script: |
      dotnet build
      dotnet test --no-build
    displayName: Build and test

  # --- PRIVATE FEEDS (section 9.6): empties the package cache, on every outcome ---
  # Without the fetch there was no restore either, so a missing script means
  # there is nothing to clear.
  - bash: |
      cleanup="$(Agent.TempDirectory)/aw/scripts/azdo-pr-feed-cleanup.sh"
      [[ -f "$cleanup" ]] || { echo 'agent-workflow was not fetched; nothing to clear'; exit 0; }
      /usr/bin/bash "$cleanup"
    displayName: clear the private package cache
    condition: and(always(), ne(variables['AWF_NUGET_FEEDS'], ''))
    env:
      # Blank, as in the restore step, so both act on the same folder.
      AWF_TEST_CACHE_ROOT: ''
