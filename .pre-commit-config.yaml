# Polyglot lint gate (pre-commit) — canonical template.
#
# Seeded into a repo root by /sync-ai-instructions. Runs as a local git hook and
# in CI via `pre-commit run --all-files`. See base-instructions.md
# ("Polyglot Lint") for what each hook catches and the Docker caveat.
#
# Pin every rev with `pre-commit autoupdate` — no floating refs.
# Hooks marked "needs Docker" have binary/system alternatives noted in the standard.

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # run-report-golden/ holds byte-exact renders of post-run-report.sh
      # (#585); a paused run's empty `LABELS: ` trailer ends in a space.
      # docs/generated/ holds the knowledge bundle (#601) — prose concatenated
      # verbatim from three repos. These hooks REWRITE what they flag, so running
      # them there would mutate bytes the generator is contracted to reproduce
      # and the next build would revert the edit. The sources are linted in
      # their own repos.
      - id: trailing-whitespace
        exclude: ^(tests/fixtures/run-report-golden/|docs/generated/)
      - id: end-of-file-fixer
        exclude: ^(tests/fixtures/run-report-golden/|docs/generated/)
      - id: check-yaml
      - id: check-json
        # tests/fixtures/ holds deliberately-malformed JSON/JSONL used to test
        # the pipeline's parse-salvage paths — not config to validate.
        exclude: ^tests/fixtures/
      - id: check-merge-conflict
      # The bundle is 18 concatenated docs — already a few hundred kB, and it
      # grows with the list — and it is generated output rather than something
      # anyone committed by hand.
      - id: check-added-large-files
        exclude: ^docs/generated/
      - id: mixed-line-ending
        exclude: ^docs/generated/

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-docker   # needs Docker; binary variant: id "actionlint"

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint            # reads .yamllint at the repo root

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        # -x follows sourced files, so a `# shellcheck source=` directive is
        # verified rather than inert. Without it a script that sources a lib/
        # helper is clean under `just lint` and fails here (#350, #353).
        # -e SC1091 is still required: tests/run-ai-funnel-tests.sh and
        # tests/run-ai-stats-tests.sh do `source "$SCRIPT"`, a variable -x
        # cannot resolve — so the inline `disable=SC1091` comments stay too.
        args: [-x, -e, SC1091]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2   # reads .markdownlint-cli2.yaml at the repo root

  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker     # needs Docker; binary variant: id "hadolint"

  - repo: https://github.com/crate-ci/typos
    rev: v1.47.2
    hooks:
      # Vocabulary in the bundle belongs to bridge and ai-instructions; a typo
      # is fixed in the source repo, not in the generated copy.
      - id: typos
        exclude: ^docs/generated/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
